services:
  backend:
    container_name: open-ai-canvas-test-backend
    image: open-ai-canvas-backend:test-3006
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      CANVAS_BACKEND_ADDR: ":8080"
      CANVAS_BACKEND_DATA_DIR: /data
      CANVAS_DATABASE_DRIVER: sqlite
      CANVAS_WORKER_CONCURRENCY: 10
      CANVAS_CHANNEL_CONCURRENCY: 10
      CANVAS_REGISTRATION_ENABLED: "true"
      CANVAS_ALLOW_PRIVATE_UPSTREAMS: "true"
      CANVAS_CORS_ORIGINS: "*"
      CANVAS_COOKIE_SECURE: "false"
      CANVAS_PUBLIC_BASE_URL: ""
      GIN_MODE: release
    volumes:
      - ./.data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - canvas-test-net

  web:
    container_name: open-ai-canvas-test-web
    image: nginx:1.27-alpine
    ports:
      - "3006:3000"
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - canvas-test-net

networks:
  canvas-test-net:
    name: open-ai-canvas-test-3006-net
    ipam:
      config:
        - subnet: 172.38.0.0/16
