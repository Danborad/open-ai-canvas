map $http_x_forwarded_proto $canvas_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

log_format canvas_no_query '$remote_addr - $remote_user [$time_local] '
                           '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent"';

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1024m;
    access_log /var/log/nginx/access.log canvas_no_query;
    add_header Referrer-Policy "no-referrer" always;
    port_in_redirect off;
    absolute_redirect off;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    location ^~ /api/public/canvas-shares/ {
        access_log off;
        proxy_pass http://backend-test:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $canvas_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600s;
    }

    location ~ ^/api/tasks/[^/]+/text-events$ {
        proxy_pass http://backend-test:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $canvas_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_pass_header X-Accel-Buffering;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/api/ai/system/[^/]+/(?:responses|chat/completions|models/[^/]+:streamGenerateContent)$ {
        proxy_pass http://backend-test:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $canvas_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_pass_header X-Accel-Buffering;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://backend-test:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $canvas_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_pass_header X-Accel-Buffering;
        proxy_read_timeout 3600s;
    }

    location = /oauth/linuxdo/callback {
        proxy_pass http://backend-test:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $canvas_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 30s;
    }

    location = /assets {
        try_files /index.html =404;
    }

    location = /assets/ {
        try_files /index.html =404;
    }

    location = /OpenAICanvas-ComfyBridge.exe {
        default_type application/octet-stream;
        add_header Cache-Control "no-cache" always;
        add_header Content-Disposition 'attachment; filename="OpenAICanvas-ComfyBridge.exe"' always;
        try_files $uri =404;
    }

    location = /OpenAICanvas-ComfyBridge-linux-amd64 {
        default_type application/octet-stream;
        add_header Cache-Control "no-cache" always;
        add_header Content-Disposition 'attachment; filename="OpenAICanvas-ComfyBridge-linux-amd64"' always;
        try_files $uri =404;
    }

    location = /OpenAICanvas-ComfyBridge-linux-arm64 {
        default_type application/octet-stream;
        add_header Cache-Control "no-cache" always;
        add_header Content-Disposition 'attachment; filename="OpenAICanvas-ComfyBridge-linux-arm64"' always;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
