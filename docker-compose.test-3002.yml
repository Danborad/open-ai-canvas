services:
  backend:
    container_name: open-ai-canvas-test-3002-backend
    image: open-ai-canvas-backend:test-3002
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      CANVAS_BACKEND_ADDR: ":8080"
      CANVAS_BACKEND_DATA_DIR: /data
      CANVAS_DATABASE_DRIVER: sqlite
      CANVAS_WORKER_CONCURRENCY: 10
      CANVAS_CHANNEL_CONCURRENCY: 10
      CANVAS_REGISTRATION_ENABLED: "true"
      CANVAS_ALLOW_PRIVATE_UPSTREAMS: "true"
      CANVAS_CORS_ORIGINS: "*"
      CANVAS_COOKIE_SECURE: "false"
      CANVAS_PUBLIC_BASE_URL: ""
      CANVAS_WECHAT_LOGIN_ENABLED: "true"
      CANVAS_WECHAT_APPID: "wx7423e3ed710143ab"
      CANVAS_WECHAT_SECRET: "${CANVAS_WECHAT_SECRET:-}"
      CANVAS_WECHAT_QR_PAGE: "pages/login/login"
      CANVAS_WECHAT_QR_ENV_VERSION: "trial"
      CANVAS_WECHAT_QR_MANUAL: "true"
      GIN_MODE: release
    user: "0:0"
    volumes:
      - ./.data-test-3002:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - canvas-test-3002-net

  web:
    container_name: open-ai-canvas-test-3002-web
    image: nginx:1.27-alpine
    user: "0:0"
    ports:
      - "3002:3000"
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - canvas-test-3002-net

networks:
  canvas-test-3002-net:
    name: open-ai-canvas-test-3002-net
